<!-- 
  كود تضمين أداة Transformer Explainer بالعربية في Google Sites
  
  طريقة الاستخدام في Google Sites:
  1. افتح موقعك في Google Sites.
  2. من القائمة الجانبية، اختر "إدراج" (Insert) > ثم "تضمين" (Embed).
  3. اختر تبويب "تضمين رمز" (Embed code).
  4. الصق الكود التالي واضغط "التالي" (Next) ثم "إدراج" (Insert).
  5. استبدل الرابط أدناه برابط موقعك بعد رفعه (مثلاً على GitHub Pages أو Netlify أو خادمك الخاص).
-->
